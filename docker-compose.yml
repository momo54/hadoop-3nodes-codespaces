version: "3.8"
services:
  master:
    build: .
    container_name: hadoop-master
    hostname: master
    environment:
      ROLE: "master"
      NN_HOST: "master"
      REPLICATION: "2"
      # Allow Hadoop daemons to run as root inside container
      HDFS_NAMENODE_USER: "root"
      HDFS_DATANODE_USER: "root"
      HDFS_SECONDARYNAMENODE_USER: "root"
      YARN_RESOURCEMANAGER_USER: "root"
      YARN_NODEMANAGER_USER: "root"
      # Ensure Java and Hadoop are on PATH for login shells
      JAVA_HOME: "/usr/local/openjdk-8"
      HADOOP_HOME: "/opt/hadoop"
      HADOOP_CONF_DIR: "/opt/hadoop/etc/hadoop"
      HADOOP_MAPRED_HOME: "/opt/hadoop"
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/hadoop/bin:/opt/hadoop/sbin"
    ports:
      - "9870:9870"
      - "8088:8088"
      - "19888:19888"
    volumes:
      - nn:/hadoop/nn
      - dn-master:/hadoop/dn
    networks: [hnet]

  worker1:
    build: .
    container_name: hadoop-w1
    hostname: w1
    environment:
      ROLE: "worker"
      NN_HOST: "master"
      REPLICATION: "2"
      HDFS_NAMENODE_USER: "root"
      HDFS_DATANODE_USER: "root"
      HDFS_SECONDARYNAMENODE_USER: "root"
      YARN_RESOURCEMANAGER_USER: "root"
      YARN_NODEMANAGER_USER: "root"
      JAVA_HOME: "/usr/local/openjdk-8"
      HADOOP_HOME: "/opt/hadoop"
      HADOOP_CONF_DIR: "/opt/hadoop/etc/hadoop"
      HADOOP_MAPRED_HOME: "/opt/hadoop"
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/hadoop/bin:/opt/hadoop/sbin"
    volumes: [dn-w1:/hadoop/dn]
    networks: [hnet]
    depends_on: [master]

  worker2:
    build: .
    container_name: hadoop-w2
    hostname: w2
    environment:
      ROLE: "worker"
      NN_HOST: "master"
      REPLICATION: "2"
      HDFS_NAMENODE_USER: "root"
      HDFS_DATANODE_USER: "root"
      HDFS_SECONDARYNAMENODE_USER: "root"
      YARN_RESOURCEMANAGER_USER: "root"
      YARN_NODEMANAGER_USER: "root"
      JAVA_HOME: "/usr/local/openjdk-8"
      HADOOP_HOME: "/opt/hadoop"
      HADOOP_CONF_DIR: "/opt/hadoop/etc/hadoop"
      HADOOP_MAPRED_HOME: "/opt/hadoop"
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/hadoop/bin:/opt/hadoop/sbin"
    volumes: [dn-w2:/hadoop/dn]
    networks: [hnet]
    depends_on: [master]

networks: { hnet: {} }
volumes: { nn: {}, dn-master: {}, dn-w1: {}, dn-w2: {} }
