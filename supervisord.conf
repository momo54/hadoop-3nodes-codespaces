[supervisord]
nodaemon=true

[program:namenode]
command=/bin/bash -lc "test \"$ROLE\" = master && /opt/hadoop/bin/hdfs --daemon start namenode || true"
autorestart=false

[program:resourcemanager]
command=/bin/bash -lc "test \"$ROLE\" = master && /opt/hadoop/bin/yarn --daemon start resourcemanager || true"
autorestart=false

[program:historyserver]
command=/bin/bash -lc "test \"$ROLE\" = master && /opt/hadoop/bin/mapred --daemon start historyserver || true"
autorestart=false

[program:datanode]
command=/bin/bash -lc "test \"$ROLE\" = worker && /opt/hadoop/bin/hdfs --daemon start datanode || true"
autorestart=false

[program:nodemanager]
command=/bin/bash -lc "test \"$ROLE\" = worker && /opt/hadoop/bin/yarn --daemon start nodemanager || true"
autorestart=false
